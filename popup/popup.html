<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Extractor</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="container">
    <!-- 头部操作栏 -->
    <header class="header">
      <div class="header-left">
        <h1 class="title">
          <span class="icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="3" ry="3"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
          </span>
          Image Extractor
        </h1>
        <span class="stats" id="stats">正在扫描...</span>
      </div>
      <div class="header-right">
        <button class="btn btn-secondary" id="openGalleryBtn" title="在大标签页中打开画廊工作台">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          <span>画廊</span>
        </button>
        <button class="btn btn-icon" id="refreshBtn" title="刷新提取">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15" />
          </svg>
        </button>
        <button class="btn btn-secondary" id="selectAllBtn">
          <span class="checkbox-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="3" ry="3"></rect>
            </svg>
          </span>
          全选
        </button>
        <button class="btn btn-primary" id="downloadBtn" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3" />
          </svg>
          下载选中
        </button>
      </div>
    </header>

    <!-- 分辨率筛选栏 -->
    <div class="filter-bar">
      <span class="filter-label">最小分辨率</span>
      <div class="filter-controls">
        <button class="filter-btn" data-min="0">全部</button>
        <button class="filter-btn" data-min="100">100px</button>
        <button class="filter-btn" data-min="300">300px</button>
        <button class="filter-btn active" data-min="500">500px</button>
        <button class="filter-btn" data-min="800">800px</button>
        <button class="filter-btn" data-min="1000">1000px</button>
      </div>
      <span class="filter-stats" id="filterStats"></span>
    </div>

    <!-- 批量重命名栏 -->
    <div class="rename-bar">
      <span class="rename-label">批量重命名</span>
      <div class="rename-controls">
        <label class="switch" title="开启/关闭批量重命名">
          <input type="checkbox" id="renameToggle" aria-label="开启批量重命名">
          <span class="slider round"></span>
        </label>
        <input type="text" id="renamePrefix" placeholder="前缀 (例如: image)" disabled class="rename-input"
          aria-label="文件名前缀">
      </div>
    </div>

    <!-- 加载状态 -->
    <div class="loader" id="loader">
      <div class="spinner"></div>
      <p>正在从标签页提取图片...</p>
    </div>

    <!-- 空状态 -->
    <div class="empty-state hidden" id="emptyState">
      <div class="empty-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 12h-6l-2 3h-4l-2-3H2v7a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-7z"></path>
          <path d="M5.45 5.11L2 12v0h20v0l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path>
        </svg>
      </div>
      <p>未找到任何图片</p>
      <span class="empty-hint">请打开包含图片的网页后重试</span>
    </div>

    <!-- 图片瀑布流容器 -->
    <div class="masonry" id="masonry"></div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
